<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-mode="dark" data-dark-theme="dark" data-light-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUNCAP Tracker</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">

  <!-- GitHub Markdown CSS for authentic README styling -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <!-- Marked.js for parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      color-scheme: dark light;
    }

    html[data-theme="dark"] {
      --bg-color: #0d1117;
      --text-color: #e6edf3;
      --border-color: #30363d;
      --btn-bg: #238636;
      --btn-text: #ffffff;
      --btn-hover: #2ea043;
      --top-bg: #161b22;
    }

    html[data-theme="light"] {
      --bg-color: #ffffff;
      --text-color: #24292f;
      --border-color: #d0d7de;
      --btn-bg: #24292f;
      --btn-text: #ffffff;
      --btn-hover: #32383f;
      --top-bg: #f6f8fa;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      background-color: var(--top-bg);
      border-radius: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 18px;
      margin: 0;
      color: var(--text-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }

    .container {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 24px 48px 24px;
    }

    .markdown-body {
      background-color: transparent !important;
      color: var(--text-color) !important;
    }

    /* High-contrast Dark Mode typography & element overrides */
    html[data-theme="dark"] .markdown-body {
      color: #e6edf3 !important;
    }

    html[data-theme="dark"] .markdown-body h1,
    html[data-theme="dark"] .markdown-body h2,
    html[data-theme="dark"] .markdown-body h3,
    html[data-theme="dark"] .markdown-body h4,
    html[data-theme="dark"] .markdown-body h5,
    html[data-theme="dark"] .markdown-body h6 {
      color: #ffffff !important;
      border-bottom-color: #30363d !important;
    }

    html[data-theme="dark"] .markdown-body p,
    html[data-theme="dark"] .markdown-body li,
    html[data-theme="dark"] .markdown-body span,
    html[data-theme="dark"] .markdown-body div {
      color: #e6edf3 !important;
    }

    html[data-theme="dark"] .markdown-body blockquote {
      color: #d29922 !important;
      border-left-color: #d29922 !important;
      background-color: #161b22 !important;
      padding: 12px 16px;
      border-radius: 6px;
    }

    html[data-theme="dark"] .markdown-body a {
      color: #58a6ff !important;
      text-decoration: underline;
    }

    html[data-theme="dark"] .markdown-body code {
      background-color: #161b22 !important;
      color: #f0f6fc !important;
      padding: 2px 6px;
      border-radius: 4px;
    }

    html[data-theme="dark"] .markdown-body pre {
      background-color: #161b22 !important;
      border: 1px solid #30363d;
      border-radius: 6px;
    }

    html[data-theme="dark"] .markdown-body hr {
      background-color: #30363d !important;
    }

    html[data-theme="dark"] .markdown-body table tr {
      background-color: #0d1117 !important;
      border-top-color: #30363d !important;
    }

    html[data-theme="dark"] .markdown-body table tr:nth-child(2n) {
      background-color: #161b22 !important;
    }

    html[data-theme="dark"] .markdown-body table th,
    html[data-theme="dark"] .markdown-body table td {
      border-color: #30363d !important;
      color: #e6edf3 !important;
    }

    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #5865F2;
      color: #ffffff !important;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none !important;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .discord-btn:hover {
      background-color: #4752C4;
      color: #ffffff !important;
      text-decoration: none !important;
    }

    .discord-btn:active {
      transform: scale(0.98);
    }

    .discord-icon {
      flex-shrink: 0;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background-color: rgba(175, 184, 193, 0.15);
    }

    .footer-nav {
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: var(--btn-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: rgba(175, 184, 193, 0.2);
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      color: #8b949e;
    }

    @media (max-width: 767px) {
      .container {
        padding: 16px 16px 32px 16px;
      }
      .header-bar {
        padding: 10px 14px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .header-actions {
        gap: 8px;
      }
      .discord-btn, .theme-toggle-btn {
        padding: 6px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Header Bar with Brand Title, Discord Support Link & Theme Toggle -->
    <header class="header-bar">
      <a href="#" class="brand-title" onclick="resetToHome(event)">
        <img src="./favicon.png" alt="FUNCAP Icon">
        <span>FUNCAP Tracker</span>
      </a>
      <div class="header-actions">
        <a href="https://discord.gg/SHdxJVmEW" target="_blank" rel="noopener noreferrer" class="discord-btn">
          <svg class="discord-icon" viewBox="0 0 127.14 96.36" width="16" height="16" fill="currentColor">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22c2.72-27.18-4.47-51.13-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91,65.69,84.69,65.69Z"/>
          </svg>
          <span>Discord Support</span>
        </a>
        <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">
          🌙 Dark Mode
        </button>
      </div>
    </header>

    <!-- Dynamic Markdown Content Area -->
    <article id="content" class="markdown-body">
      <div class="loading">Loading content...</div>
    </article>

    <!-- Bottom Action Bar -->
    <div class="footer-nav">
      <button id="toggle-btn" class="btn" onclick="toggleView()">Privacy Policy</button>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'randrewfox';
    const REPO_NAME = 'FuncapTracker';

    // Theme Management - Default to Dark Mode for new users
    function initTheme() {
      const savedTheme = localStorage.getItem('funcap_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-color-mode', theme);
      document.documentElement.setAttribute('data-dark-theme', 'dark');
      document.documentElement.setAttribute('data-light-theme', 'light');
      localStorage.setItem('funcap_theme', theme);

      const btn = document.getElementById('theme-toggle');
      if (btn) {
        if (theme === 'dark') {
          btn.innerHTML = '🌙 Dark Mode';
        } else {
          btn.innerHTML = '☀️ Light Mode';
        }
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    }

    // Execute initTheme immediately to prevent any theme flickering
    initTheme();

    let currentView = 'readme'; // 'readme' or 'privacy'
    let readmeHtml = '';
    let privacyHtml = '';
    let privacyFileUrl = null;

    const candidatePrivacyFiles = [
      'PRIVACY.md',
      'PRIVACY_POLICY.md',
      'PrivacyPolicy.md',
      'Privacy.md',
      'privacy.md',
      'privacy-policy.md',
      'privacy_policy.md'
    ];

    async function fetchText(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error('File not found');
      return await response.text();
    }

    async function loadReadme() {
      const contentEl = document.getElementById('content');
      try {
        const md = await fetchText('./README.md');
        readmeHtml = marked.parse(md);
        contentEl.innerHTML = readmeHtml;
      } catch (e) {
        try {
          const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/readme`);
          const data = await res.json();
          const md = await fetchText(data.download_url);
          readmeHtml = marked.parse(md);
          contentEl.innerHTML = readmeHtml;
        } catch (err) {
          contentEl.innerHTML = `<h1>FUNCAP Tracker</h1><p>Welcome to FUNCAP Tracker. Visit our <a href="https://github.com/${REPO_OWNER}/${REPO_NAME}">GitHub Repository</a> for more details.</p>`;
        }
      }
    }

    async function findAndLoadPrivacyPolicy() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`);
        if (res.ok) {
          const files = await res.json();
          const privacyFile = files.find(f => 
            f.type === 'file' && f.name.toLowerCase().includes('privacy')
          );
          if (privacyFile) {
            if (privacyFile.name.toLowerCase().endsWith('.html')) {
              privacyFileUrl = `./${privacyFile.name}`;
              return;
            }
            const md = await fetchText(privacyFile.download_url);
            privacyHtml = marked.parse(md);
            return;
          }
        }
      } catch (e) { }

      for (const filename of candidatePrivacyFiles) {
        try {
          const md = await fetchText(`./${filename}`);
          privacyHtml = marked.parse(md);
          return;
        } catch (e) { }
      }
    }

    function resetToHome(e) {
      if (e) e.preventDefault();
      if (currentView === 'privacy') {
        toggleView();
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    async function toggleView() {
      const contentEl = document.getElementById('content');
      const btn = document.getElementById('toggle-btn');

      if (currentView === 'readme') {
        if (!privacyHtml && !privacyFileUrl) {
          contentEl.innerHTML = '<div class="loading">Loading Privacy Policy...</div>';
          await findAndLoadPrivacyPolicy();
        }

        if (privacyFileUrl) {
          window.location.href = privacyFileUrl;
          return;
        }

        if (privacyHtml) {
          contentEl.innerHTML = privacyHtml;
          btn.textContent = '← Back to Home (README)';
          btn.classList.add('btn-secondary');
          currentView = 'privacy';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          history.pushState({ view: 'privacy' }, 'Privacy Policy', '#privacy');
        } else {
          window.location.href = `https://github.com/${REPO_OWNER}/${REPO_NAME}`;
        }
      } else {
        contentEl.innerHTML = readmeHtml;
        btn.textContent = 'Privacy Policy';
        btn.classList.remove('btn-secondary');
        currentView = 'readme';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        history.pushState({ view: 'readme' }, 'FUNCAP Tracker', window.location.pathname);
      }
    }

    window.addEventListener('popstate', () => {
      if (window.location.hash === '#privacy' && currentView !== 'privacy') {
        toggleView();
      } else if (window.location.hash !== '#privacy' && currentView === 'privacy') {
        toggleView();
      }
    });

    (async function init() {
      await loadReadme();
      findAndLoadPrivacyPolicy().then(() => {
        if (window.location.hash === '#privacy') {
          toggleView();
        }
      });
    })();
  </script>
</body>
</html>
